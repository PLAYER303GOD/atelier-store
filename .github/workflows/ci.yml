name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and admin guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # src/db/index.ts throws at import without it; nothing here connects to a database.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      # Version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Every admin page and action checks the admin role
        run: pnpm check:admin
